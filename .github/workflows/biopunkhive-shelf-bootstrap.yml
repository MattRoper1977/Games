name: Biopunk Hive shelf one-shot

on:
  push:
    branches:
      - 'shelf/biopunkhive-2026-08-04'
    paths:
      - '.github/workflows/biopunkhive-shelf-bootstrap.yml'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/biopunkhive-shelf-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: biopunkhive-shelf-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  mutate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out shelf branch
        uses: actions/checkout@v4
        with:
          ref: shelf/biopunkhive-2026-08-04
          fetch-depth: 0

      - name: Insert shelf entry idempotently
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import copy, json

          path = Path('games.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if not isinstance(data, dict) or not isinstance(data.get('games'), list):
              raise SystemExit('games.json root contract failed')
          target = {
              'icon': '🧫',
              'title': 'NEW · Biopunk Hive — Containment Lab',
              'desc': 'Grow a forbidden hive, manage toxicity, condense cryo-stasis rewards and stabilise breaches in a tactile biopunk idle lab.',
              'href': '/biopunkhive/',
              'tag': 'Idle',
              'hue': '#00FF66',
              'featured': False,
              'hero': False,
              'art': '/assets/cards/biopunk-hive.svg',
          }

          def apply(doc):
              games = doc['games']
              hits = [i for i, game in enumerate(games) if game.get('href') == target['href']]
              if len(hits) > 1:
                  raise SystemExit('duplicate Biopunk Hive shelf href')
              if hits:
                  if games[hits[0]] != target:
                      raise SystemExit('existing Biopunk Hive entry conflicts with canonical shelf entry')
              else:
                  games.insert(0, copy.deepcopy(target))
              if any(not isinstance(game.get('art'), str) or not game['art'].strip() for game in games):
                  raise SystemExit('every games.json entry must carry art')
              if sum(game.get('href') == target['href'] for game in games) != 1:
                  raise SystemExit('Biopunk Hive shelf entry is not unique')
              return doc

          first = apply(copy.deepcopy(data))
          second = apply(copy.deepcopy(first))
          if first != second:
              raise SystemExit('shelf mutation is not idempotent')
          path.write_text(json.dumps(first, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Add deterministic shelf verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          cat > tools/verify_biopunkhive_shelf.js <<'JS'
          #!/usr/bin/env node
          'use strict';
          const fs = require('fs');
          const path = require('path');
          let checks = 0;
          const pass = (condition, message) => {
            checks += 1;
            if (!condition) throw new Error(`FAIL ${checks}: ${message}`);
            console.log(`PASS ${checks}: ${message}`);
          };
          const manifestPath = path.join(__dirname, '..', 'games.json');
          const raw = fs.readFileSync(manifestPath, 'utf8');
          const data = JSON.parse(raw);
          pass(data && typeof data === 'object', 'manifest root is an object');
          pass(Array.isArray(data.games), 'manifest exposes games array');
          pass(data.games.length > 0, 'manifest contains games');
          pass(data.games.every(game => typeof game.art === 'string' && game.art.trim()), 'every entry carries art');
          const target = data.games.filter(game => game.href === '/biopunkhive/');
          pass(target.length === 1, 'Biopunk Hive href is unique');
          const game = target[0];
          pass(game.title === 'NEW · Biopunk Hive — Containment Lab', 'NEW title is exact');
          pass(game.tag === 'Idle', 'tag is Idle');
          pass(game.hue === '#00FF66', 'shelf hue is neon slime');
          pass(game.art === '/assets/cards/biopunk-hive.svg', 'art path is present and canonical');
          pass(game.featured === false && game.hero === false, 'no homepage or hero placement is requested');
          pass(game.href.startsWith('/') && !/^https?:/i.test(game.href), 'href is site-relative');
          pass(new Set(data.games.map(item => item.href)).size === data.games.length, 'all shelf hrefs remain unique');
          const clone = JSON.parse(JSON.stringify(data));
          const before = JSON.stringify(clone);
          if (!clone.games.some(item => item.href === '/biopunkhive/')) clone.games.unshift(game);
          pass(JSON.stringify(clone) === before, 'canonical insertion is idempotent');
          console.log(`Biopunk Hive shelf contract: ${checks} checks passed.`);
          JS
          chmod +x tools/verify_biopunkhive_shelf.js
          node tools/verify_biopunkhive_shelf.js

      - name: Publish non-workflow shelf files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games.json tools/verify_biopunkhive_shelf.js
          git diff --cached --check
          git commit -m 'feat: add Biopunk Hive arcade shelf entry'
          git push origin HEAD:shelf/biopunkhive-2026-08-04
