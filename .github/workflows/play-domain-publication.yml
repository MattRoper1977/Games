name: Standalone games website
on:
  pull_request:
    branches: [main]
    paths: ['games.json', 'play-publication.json', '.github/workflows/play-domain-publication.yml', 'docs/play-domain.md']
  # Reviewed publication pins deploy after merge; PRs only assemble and verify.
  push:
    branches: [main]
    paths: ['games.json', 'play-publication.json', '.github/workflows/play-domain-publication.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after Games Pages source and custom domain are configured
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: play-domain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Assemble all games independently
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read pinned publication sources
        id: sources
        run: |
          python - <<'PY'
          import json,os,re
          c=json.load(open('play-publication.json'))
          assert c['domain']=='madebymatt-play.uk'
          assert all(re.fullmatch('[0-9a-f]{40}',c[k]) for k in ['site_commit','lessons_commit'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('site='+c['site_commit']+'\nlessons='+c['lessons_commit']+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/mattroper1977.github.io
          ref: ${{ steps.sources.outputs.site }}
          path: .sources/Site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Lessons
          ref: ${{ steps.sources.outputs.lessons }}
          path: .sources/Lessons
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install publication HTML parser
        run: python -m pip install lxml==6.0.1
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build and check all game payloads and save boundaries
        run: |
          python .sources/Site/domain-split/build_publications.py --lessons .sources/Lessons
          node .sources/Site/domain-split/check_game_saves.cjs
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('.sources/Site/domain-split/output')
          r=json.loads((out/'build-report.json').read_text())
          assert r['counts']['game_payloads']==69
          assert r['counts']['missing_initial_load_refs']==0
          assert r['counts']['external_initial_load_refs']==0
          assert (out/'games/games.json').read_bytes()==Path('games.json').read_bytes()
          assert (out/'games/CNAME').read_text().strip()=='madebymatt-play.uk'
          print(json.dumps(r['counts'],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-games-review
          path: .sources/Site/domain-split/output/games
          include-hidden-files: true
          retention-days: 30
      - name: Require the configured games destination and working HTTPS
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.repos.getPages({owner: context.repo.owner, repo: context.repo.repo});
            const domains = ['madebymatt-play.uk', 'www.madebymatt-play.uk'];
            core.info(JSON.stringify({build_type: data.build_type, cname: data.cname, html_url: data.html_url, https_enforced: data.https_enforced}));
            if (data.build_type !== 'workflow' || !domains.includes(data.cname)) {
              throw new Error('Games Pages must use GitHub Actions and the madebymatt-play.uk custom domain (apex or www).');
            }
            const destination = new URL(data.html_url);
            if (!['http:', 'https:'].includes(destination.protocol) || !domains.includes(destination.hostname) || destination.pathname !== '/' || destination.search || destination.hash || destination.port || destination.username || destination.password) {
              throw new Error('Games Pages must identify the root of the configured games domain.');
            }
            // html_url is Pages metadata; prove TLS against the actual site.
            // This read-only guard runs on PRs too, before a pin is merged.
            const config = JSON.parse(require('node:fs').readFileSync('play-publication.json', 'utf8'));
            let probe = new URL('/data/domain-catalogue.json', 'https://' + data.cname);
            let response;
            for (let hop = 0; hop < 3; hop++) {
              if (probe.protocol !== 'https:' || !domains.includes(probe.hostname) || probe.pathname !== '/data/domain-catalogue.json' || probe.search || probe.hash || probe.port || probe.username || probe.password) {
                throw new Error('The HTTPS games probe changed its origin or resource.');
              }
              response = await fetch(probe, {redirect: 'manual', signal: AbortSignal.timeout(25000)});
              if (![301, 302, 303, 307, 308].includes(response.status)) break;
              const location = response.headers.get('location');
              if (!location) throw new Error('Games redirect has no destination.');
              probe = new URL(location, probe);
            }
            if (response.status !== 200) throw new Error('The HTTPS games catalogue did not return 200.');
            const catalogue = await response.json();
            if (!Array.isArray(catalogue.games) || !Array.isArray(catalogue.activities) || !Array.isArray(catalogue.staff) || catalogue.games.length !== config.canonical_games || catalogue.activities.length + catalogue.staff.length !== config.additional_activities) {
              throw new Error('The secure destination does not serve the configured games population.');
            }
            core.info('Verified HTTPS games catalogue at ' + probe.href);
      - name: Read the configured Pages site
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        uses: actions/configure-pages@v5
      - name: Prepare Pages deployment artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        uses: actions/upload-pages-artifact@v3
        with:
          path: .sources/Site/domain-split/output/games
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified games artifact
        id: deployment
        uses: actions/deploy-pages@v4
