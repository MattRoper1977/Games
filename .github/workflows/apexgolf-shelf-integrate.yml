name: Integrate Apex Golf shelf with current Sports manifest

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apexgolf-shelf-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Merge the governed shelf branch and extend the inherited Sports contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/apexgolf-shelf
          git merge --no-ff --no-commit origin/codex/apexgolf-shelf || true

          unresolved=$(git diff --name-only --diff-filter=U || true)
          unexpected=$(printf '%s\n' "$unresolved" | sed '/^$/d;/^games.json$/d')
          if [ -n "$unexpected" ]; then
            printf 'Unexpected merge conflicts:\n%s\n' "$unexpected"
            exit 1
          fi

          # Re-derive the candidate from current main, then apply the Golf upsert twice.
          git show HEAD:games.json > games.json
          cp games.json /tmp/games-before.json
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'games.json';
          const doc = JSON.parse(fs.readFileSync(path, 'utf8'));
          const entry = {
            icon: '⛳',
            title: 'Apex Golf',
            desc: 'A top-down golf game about reading the hole and knowing your own game. Call your stroke count, play nine seeded holes with honest wind and slope, then earn a Call Rating. Works offline.',
            href: '/apexgolf/',
            tag: 'Physics',
            hue: '#7C5CFC',
            featured: false,
            hero: false,
            art: '/assets/cards/apex-golf.svg',
            collection: 'Sports'
          };
          function upsert() {
            const matches = doc.games.filter((game) => game.title === entry.title || game.href === entry.href);
            if (matches.length > 1) throw new Error('duplicate Apex Golf entries before upsert');
            const index = doc.games.findIndex((game) => game.title === entry.title || game.href === entry.href);
            if (index === -1) doc.games.push(entry); else doc.games[index] = entry;
          }
          upsert();
          const once = JSON.stringify(doc, null, 2) + '\n';
          upsert();
          const twice = JSON.stringify(doc, null, 2) + '\n';
          if (once !== twice) throw new Error('Apex Golf shelf upsert is not idempotent');
          fs.writeFileSync(path, twice);
          console.log(`entries 32 -> ${doc.games.length}`);
          console.log(`art ${doc.games.filter((game) => game.art).length}/${doc.games.length}`);
          console.log(`Sports ${doc.games.filter((game) => game.collection === 'Sports').map((game) => game.title).join(' | ')}`);
          console.log('idempotency second run: unchanged');
          NODE
          git add games.json

          cat > tools/verify_apexpool_sports_manifest.js <<'JS'
          #!/usr/bin/env node
          'use strict';
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const { spawnSync } = require('child_process');
          const args = process.argv.slice(2);
          const selfTest = args.includes('--self-test');
          const supplied = args.find((arg) => arg !== '--self-test');
          const FILE = supplied || path.join(__dirname, '..', 'games.json');
          const BASELINE = process.env.APEXPOOL_GAMES_BASELINE || path.join(__dirname, '..', 'artifacts', 'apexpool-sports', 'games-before.json');
          const expectedGolf = {
            icon: '⛳', title: 'Apex Golf',
            desc: 'A top-down golf game about reading the hole and knowing your own game. Call your stroke count, play nine seeded holes with honest wind and slope, then earn a Call Rating. Works offline.',
            href: '/apexgolf/', tag: 'Physics', hue: '#7C5CFC', featured: false, hero: false,
            art: '/assets/cards/apex-golf.svg', collection: 'Sports'
          };
          function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
          function census(games) { const out = {}; games.forEach((g) => { out[g.tag] = (out[g.tag] || 0) + 1; }); return out; }
          function selfCheck() {
            const source = fs.readFileSync(FILE, 'utf8');
            const root = fs.mkdtempSync(path.join(os.tmpdir(), 'games-golf-sports-'));
            const cases = [
              ['membership', 'sports-membership-exact', (s) => s.replace('"art": "/assets/cards/apex-golf.svg",\n      "collection": "Sports"', '"art": "/assets/cards/apex-golf.svg",\n      "collection": "Other"')],
              ['art', 'all-entries-carry-art', (s) => s.replace('"art": "/assets/cards/apex-golf.svg"', '"art": ""')],
              ['tag', 'tag-vocabulary-unchanged', (s) => s.replace('"tag": "Physics",\n      "hue": "#7C5CFC"', '"tag": "Sport",\n      "hue": "#7C5CFC"')],
              ['hue', 'golf-hue-distinct-and-new', (s) => s.replace('"hue": "#7C5CFC"', '"hue": "#2F8F6B"')],
              ['duplicate', 'golf-title-and-href-unique', (s) => s.replace('"title": "Apex Golf"', '"title": "Apex Pool"')]
            ];
            let missed = 0;
            console.log('== Apex Golf Sports manifest non-vacuity ==');
            cases.forEach(([family, expected, mutate], index) => {
              const changed = mutate(source);
              const file = path.join(root, `${index}-${family}.json`);
              fs.writeFileSync(file, changed);
              const child = spawnSync(process.execPath, [__filename, file], { encoding: 'utf8', env: process.env });
              const output = `${child.stdout || ''}\n${child.stderr || ''}`;
              if (changed !== source && child.status !== 0 && output.includes(`FAIL  ${expected}`)) console.log(`  PASS  ${family}: rejected by ${expected}`);
              else { missed++; console.log(`  FAIL  ${family}: expected ${expected} to reject the tamper`); }
            });
            fs.rmSync(root, { recursive: true, force: true });
            console.log(missed ? `${cases.length - missed} detected, ${missed} missed` : `ALL ${cases.length} PLANTED FAILURES WERE DETECTED`);
            process.exit(missed ? 1 : 0);
          }
          if (selfTest) selfCheck();
          const beforeRaw = fs.readFileSync(BASELINE, 'utf8');
          const afterRaw = fs.readFileSync(FILE, 'utf8');
          const before = JSON.parse(beforeRaw).games || [];
          const after = JSON.parse(afterRaw).games || [];
          let pass = 0, fail = 0;
          function ok(name, condition, detail = '') {
            if (condition) { pass++; console.log('  PASS  ' + name + (detail ? '   ' + detail : '')); }
            else { fail++; console.log('  FAIL  ' + name + (detail ? '   ' + detail : '')); }
          }
          const golfRows = after.filter((g) => g.title === 'Apex Golf');
          const golfHrefs = after.filter((g) => g.href === '/apexgolf/');
          const sportsBefore = before.filter((g) => g.collection === 'Sports');
          const sportsAfter = after.filter((g) => g.collection === 'Sports');
          const survivorsAfter = after.filter((g) => g.title !== 'Apex Golf');
          const tagsBefore = census(before), tagsAfter = census(after);
          const kick = before.find((g) => g.title === 'Apex Kick');
          const pool = before.find((g) => g.title === 'Apex Pool');
          console.log('== Apex Golf Sports manifest contract ==');
          ok('baseline-entry-count-measured', before.length === 32, String(before.length));
          ok('candidate-entry-count-derived', after.length === before.length + 1, `${before.length} -> ${after.length}`);
          ok('baseline-sports-membership-preserved', same(sportsBefore.map((g) => g.title), ['Apex Kick', 'Apex Pool']), sportsBefore.map((g) => g.title).join(' | '));
          ok('sports-membership-exact', same(sportsAfter.map((g) => g.title), ['Apex Kick', 'Apex Pool', 'Apex Golf']), sportsAfter.map((g) => g.title).join(' | '));
          ok('golf-title-and-href-unique', golfRows.length === 1 && golfHrefs.length === 1 && golfRows[0] === golfHrefs[0]);
          ok('golf-schema-and-copy-exact', golfRows.length === 1 && same(golfRows[0], expectedGolf));
          ok('all-existing-entries-byte-equivalent', same(before, survivorsAfter));
          ok('golf-appended-after-pool', after[after.length - 2].title === 'Apex Pool' && after[after.length - 1].title === 'Apex Golf');
          ok('all-entries-carry-art', after.every((g) => typeof g.art === 'string' && g.art.length > 0));
          ok('tag-vocabulary-unchanged', same(Object.keys(tagsBefore).sort(), Object.keys(tagsAfter).sort()), `${JSON.stringify(tagsBefore)} -> ${JSON.stringify(tagsAfter)}`);
          ok('physics-count-increases-by-one', tagsBefore.Physics === 6 && tagsAfter.Physics === 7, `${tagsBefore.Physics} -> ${tagsAfter.Physics}`);
          ok('golf-hue-distinct-and-new', golfRows.length === 1 && golfRows[0].hue !== kick.hue && golfRows[0].hue !== pool.hue && !before.some((g) => g.hue.toUpperCase() === golfRows[0].hue.toUpperCase()), golfRows.length ? golfRows[0].hue : 'missing');
          ok('site-relative-house-link', golfRows.length === 1 && golfRows[0].href === '/apexgolf/');
          ok('description-is-shipped-meta-copy', golfRows.length === 1 && golfRows[0].desc === expectedGolf.desc);
          ok('no-lessons-contamination', !afterRaw.includes('Apex_Golf') && !afterRaw.includes('/Lessons/Apex_Golf/'));
          console.log('='.repeat(64));
          console.log(fail === 0 ? `ALL ${pass} APEX GOLF MANIFEST CHECKS PASSED` : `${pass} passed, ${fail} FAILED`);
          console.log('='.repeat(64));
          process.exit(fail ? 1 : 0);
          JS

          cat > tools/verify_apexpool_sports_browser.js <<'JS'
          #!/usr/bin/env node
          'use strict';
          const fs = require('fs');
          const { chromium } = require('playwright');
          const BASE = (process.env.ARCADE_BASE_URL || 'http://127.0.0.1:4173').replace(/\/$/, '');
          const games = (JSON.parse(fs.readFileSync(process.env.APEXPOOL_GAMES_FILE || 'games.json', 'utf8')).games || []);
          const before = (JSON.parse(fs.readFileSync(process.env.APEXPOOL_GAMES_BASELINE, 'utf8')).games || []);
          let pass = 0, fail = 0;
          function ok(name, condition, detail = '') { if (condition) { pass++; console.log('  PASS  ' + name + (detail ? '   ' + detail : '')); } else { fail++; console.log('  FAIL  ' + name + (detail ? '   ' + detail : '')); } }
          function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
          (async () => {
            let browser;
            try {
              browser = await chromium.launch({ headless: true });
              const context = await browser.newContext({ viewport: { width: 1180, height: 900 }, reducedMotion: 'reduce' });
              const page = await context.newPage();
              const errors = [];
              page.on('console', (message) => { if (message.type() === 'error') errors.push('console: ' + message.text()); });
              page.on('pageerror', (error) => errors.push('pageerror: ' + error.message));
              const response = await page.goto(BASE + '/games/', { waitUntil: 'domcontentloaded' });
              await page.waitForFunction(() => document.querySelectorAll('#sportsRail .gcard').length === 3 && !/Loading|could not load/.test(document.getElementById('countline').textContent));
              const snapshot = await page.evaluate(() => {
                function title(element) { const node = element.querySelector('h3') || element.querySelector('h4 span'); return node ? node.textContent.trim() : ''; }
                function cards(selector) { return [...document.querySelectorAll(selector)].map((element) => ({ title: title(element), href: new URL(element.getAttribute('href'), location.href).pathname })); }
                return {
                  sports: cards('#sportsRail .gcard'), top: cards('#topRail .pick'), themes: cards('#tgrids .gcard'), classroom: cards('#classRail .gcard'), shelf: cards('#allGrid .gcard'), all: cards('.pick,.gcard'),
                  chips: [...document.querySelectorAll('#chips .chip')].map((button) => button.textContent.trim()), count: document.getElementById('countline').textContent.trim(),
                  hidden: document.getElementById('sports').hidden, copy: document.querySelector('#sports .sub').textContent.trim(), overflow: document.documentElement.scrollWidth > innerWidth,
                  reduced: matchMedia('(prefers-reduced-motion: reduce)').matches
                };
              });
              const occurrence = (name) => snapshot.all.filter((card) => card.title === name).length;
              const top = ['Voxel Frontier', 'Off-Brand', 'Glitch Clash', 'Hold the Mark', 'Orbital', 'Slipstream - GP', 'Grid Chase'];
              const themes = ['Orbital', 'Marble', 'Trail Runner', 'Trekkers Trail Runner — Tees Coast', 'Grid Chase', 'Neon Garden', 'Neon Siege'];
              const classroom = before.filter((game) => game.tag === 'Class game').map((game) => game.title);
              const curated = ['Apex Kick', 'Voxel Frontier', 'Off-Brand', 'Glitch Clash', 'Hold the Mark', 'Orbital', 'Slipstream - GP', 'Grid Chase', 'Marble', 'Trail Runner', 'Trekkers Trail Runner — Tees Coast', 'Neon Garden', 'Neon Siege'];
              const shelf = games.filter((game) => game.collection !== 'Sports').slice().sort((a, b) => (curated.includes(a.title) ? 0 : 1) - (curated.includes(b.title) ? 0 : 1) || a.title.localeCompare(b.title)).map((game) => game.title);
              console.log('== Rendered Apex Golf Sports gates ==');
              ok('arcade-responds-200', response && response.status() === 200, response ? String(response.status()) : 'none');
              ok('sports-exactly-three-adjacent', !snapshot.hidden && same(snapshot.sports.map((card) => card.title), ['Apex Kick', 'Apex Pool', 'Apex Golf']), JSON.stringify(snapshot.sports));
              ok('apex-kick-once', occurrence('Apex Kick') === 1, String(occurrence('Apex Kick')));
              ok('apex-pool-once', occurrence('Apex Pool') === 1, String(occurrence('Apex Pool')));
              ok('apex-golf-once', occurrence('Apex Golf') === 1, String(occurrence('Apex Golf')));
              ok('top-survivors-exact', same(snapshot.top.map((card) => card.title), top));
              ok('themed-exact', same(snapshot.themes.map((card) => card.title), themes));
              ok('classroom-exact', same(snapshot.classroom.map((card) => card.title), classroom));
              ok('shelf-exact', same(snapshot.shelf.map((card) => card.title), shelf));
              ok('no-sport-chip', !snapshot.chips.includes('SPORT') && snapshot.chips.includes('PHYSICS'), snapshot.chips.join(' | '));
              ok('links-exact', same(snapshot.sports.map((card) => card.href), ['/apexkick/', '/apexpool/', '/apexgolf/']));
              ok('count-derived', snapshot.count.includes(String(games.length)) && snapshot.count.includes(String(games.length - 3)), snapshot.count);
              ok('sports-copy-names-golf', snapshot.copy.includes('Three Apex games') && snapshot.copy.includes('Apex Golf'), snapshot.copy);
              ok('reduced-motion-no-overflow', snapshot.reduced && !snapshot.overflow);
              ok('zero-console-errors', errors.length === 0, errors.join(' | ') || 'none');
              await context.close();
            } catch (error) { fail++; console.error(error.stack || error); }
            finally { if (browser) await browser.close(); }
            console.log('='.repeat(64));
            console.log(fail === 0 ? `ALL ${pass} SPORTS BROWSER CHECKS PASSED` : `${pass} passed, ${fail} FAILED`);
            console.log('='.repeat(64));
            process.exit(fail ? 1 : 0);
          })();
          JS
          chmod +x tools/verify_apexpool_sports_manifest.js tools/verify_apexpool_sports_browser.js

          test -z "$(git diff --name-only --diff-filter=U)"
          APEXPOOL_GAMES_BASELINE=/tmp/games-before.json node tools/verify_apexpool_sports_manifest.js
          APEXPOOL_GAMES_BASELINE=/tmp/games-before.json node tools/verify_apexpool_sports_manifest.js --self-test

          git add games.json tools/verify_apexpool_sports_manifest.js tools/verify_apexpool_sports_browser.js
          git commit -m "feat: add Apex Golf to the Sports shelf"
          git push origin "HEAD:${{ github.head_ref }}"
