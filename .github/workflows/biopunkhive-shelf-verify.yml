name: Biopunk Hive arcade shelf contract

on:
  pull_request:
    paths:
      - 'games.json'
      - 'tools/verify_biopunkhive_shelf.js'
      - '.github/workflows/biopunkhive-shelf-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biopunkhive-shelf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run shelf contract
        run: node tools/verify_biopunkhive_shelf.js

      - name: Prove mutation remains idempotent
        shell: bash
        run: |
          set -euo pipefail
          cp games.json /tmp/games-before.json
          python3 - <<'PY'
          from pathlib import Path
          import copy, json
          path = Path('games.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          target = [game for game in data['games'] if game.get('href') == '/biopunkhive/']
          if len(target) != 1:
              raise SystemExit('Biopunk Hive entry is not unique')
          if not any(game.get('href') == '/biopunkhive/' for game in data['games']):
              data['games'].insert(0, copy.deepcopy(target[0]))
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          cmp -s /tmp/games-before.json games.json

      - name: Verify live game target and exact identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 10 --retry-all-errors \
            https://madebymatt.uk/biopunkhive/ -o /tmp/biopunkhive-live.html
          test "$(wc -c < /tmp/biopunkhive-live.html)" -eq 76841
          echo 'f129e84bf8718d4b14feb9d3492cc6d534a86d3b0ee5438ed077652b3790080e  /tmp/biopunkhive-live.html' | sha256sum -c -
          test "$(grep -o 'biopunkhive-build-2026-08-04' /tmp/biopunkhive-live.html | wc -l)" -eq 2
          grep -q '<title>Biopunk Hive — Made by Matt</title>' /tmp/biopunkhive-live.html
