name: Apply Apex Pool Sports manifest entry

on:
  push:
    branches:
      - codex/apexpool-arcade-sports
    paths:
      - 'tools/apply_apexpool_sports_manifest.js'
      - '.github/workflows/apexpool-sports-prep.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/apexpool-arcade-sports
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the byte-preserving manifest append
        run: node tools/apply_apexpool_sports_manifest.js
      - name: Constrain and publish the manifest-only transformation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- games.json
          test "$(git diff --name-only)" = 'games.json'
          rm tools/apply_apexpool_sports_manifest.js .github/workflows/apexpool-sports-prep.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Apex Pool to the Sports collection'
          git push origin HEAD:codex/apexpool-arcade-sports
