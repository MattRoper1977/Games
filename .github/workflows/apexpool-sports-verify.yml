name: Apex Sports manifest contract

# SCOPED: 'games.json' was removed from these paths deliberately.
# The gate this workflow runs (tools/verify_apexpool_sports_manifest.js) is a
# ONE-SHOT contract for the Apex Tennis landing: it asserts the candidate is
# exactly "baseline + one Apex Tennis entry appended after Apex Golf, Physics
# count +1". That landing merged long ago, so the gate can no longer pass for
# ANY other manifest change — yet it triggered on every games.json edit and
# failed each one (four times on shelf/biopunkhive-2026-08-04 alone). A spent
# one-shot gate must not judge unrelated content.
# The gate itself is NOT weakened or deleted: it still runs on its own tools
# and on workflow_dispatch, so Apex Tennis's contract remains reproducible.
on:
  pull_request:
    paths:
      - 'tools/apply_apextennis_manifest.py'
      - 'tools/verify_apextennis_manifest.js'
      - 'tools/verify_apexpool_sports_manifest.js'
      - 'tools/verify_apexpool_sports_browser.js'
      - '.github/workflows/apexpool-sports-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apex-sports-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Games candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The baseline entry count is DERIVED from origin/main, never pinned.
      # This step used to assert `games.length !== 33`. The manifest passed 33
      # the next time a card landed, so the gate began failing at its own
      # baseline — red for reasons that had nothing to do with the candidate
      # under test. Re-pinning to 34, 35 or 37 would rot the same way on the
      # next card, so the number is now read rather than asserted. What IS
      # still enforced is the part that must never drift: the baseline parses,
      # carries a games array, and is non-empty — so a corrupt or truncated
      # baseline fails loudly instead of passing vacuously.
      - name: Capture the current manifest baseline (count derived, not pinned)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/apextennis-sports
          git show origin/main:games.json > artifacts/apextennis-sports/games-before.json
          node -e "
            const d=require('./artifacts/apextennis-sports/games-before.json');
            if(!d.games||!Array.isArray(d.games)){console.error('FAIL baseline has no games array');process.exit(1)}
            if(d.games.length<1){console.error('FAIL baseline manifest is empty — an empty baseline would pass vacuously');process.exit(1)}
            console.log('baseline entries='+d.games.length+' (derived from origin/main)');
          "
      - name: Check out the paired Arcade renderer and card art
        uses: actions/checkout@v4
        with:
          repository: MattRoper1977/mattroper1977.github.io
          ref: codex/apextennis-arcade-sports
          path: site
      - name: Run manifest, art, idempotency and non-vacuity gates
        shell: bash
        env:
          APEXPOOL_GAMES_BASELINE: artifacts/apextennis-sports/games-before.json
          APEXTENNIS_ART_FILE: site/assets/cards/apex-tennis.svg
        run: |
          set -euo pipefail
          node --check tools/verify_apextennis_manifest.js
          node tools/verify_apexpool_sports_manifest.js | tee artifacts/apextennis-sports/manifest.log
          node tools/verify_apexpool_sports_manifest.js --self-test | tee artifacts/apextennis-sports/nonvacuity.log
          before=$(sha256sum games.json | cut -d' ' -f1)
          python3 tools/apply_apextennis_manifest.py | tee artifacts/apextennis-sports/idempotency.log
          test "$before" = "$(sha256sum games.json | cut -d' ' -f1)"
      - name: Mount the candidate manifest under the site origin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/Games
          cp games.json site/Games/games.json
      - name: Install pinned Chromium harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve the paired candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site > artifacts/apextennis-sports/server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/games/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/apextennis-sports/server.log
          exit 1
      - name: Run end-to-end rendered gates
        shell: bash
        env:
          ARCADE_BASE_URL: http://127.0.0.1:4173
          APEXPOOL_GAMES_FILE: games.json
        run: |
          set -o pipefail
          node tools/verify_apexpool_sports_browser.js | tee artifacts/apextennis-sports/browser.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-tennis-sports-evidence-${{ github.run_id }}
          path: artifacts/apextennis-sports/
          if-no-files-found: error
          retention-days: 30
